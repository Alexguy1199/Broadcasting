services:
  - type: worker
    name: telethon-broadcast-bot
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    autoDeploy: true
    envVars:
      - key: API_ID
        value: YOUR_API_ID
      - key: API_HASH
        value: YOUR_API_HASH
      - key: BOT_TOKEN
        value: YOUR_BOT_TOKEN
      - key: OWNER_ID
        value: YOUR_OWNER_ID
      - key: MONGO_URL
        value: YOUR_MONGO_URI
      - key: DELAY
        value: "0.5"
